name: Claude Code
jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 1
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: post-checkout inspection"
        printf 'GERALT_DBG event=%s ref=%s sha=%s\n' "${GITHUB_EVENT_NAME:-}" "${GITHUB_REF:-}" "${GITHUB_SHA:-}"
        if [ -d .git ]; then
          git rev-parse HEAD 2>/dev/null | sed 's/^/GERALT_DBG HEAD: /' || echo "GERALT_DBG git rev-parse failed"
        else
          echo "GERALT_DBG no .git directory"
        fi
        for f in pyproject.toml uv.lock .pre-commit-config.yaml; do
          if [ -f "$f" ]; then
            echo "GERALT_DBG found $f"
            sha256sum "$f" 2>/dev/null | sed 's/^/GERALT_DBG   /' || true
            sed -n '1,30p' "$f" 2>/dev/null | sed 's/^/GERALT_DBG   /' || true
          else
            echo "GERALT_DBG missing $f"
          fi
        done
      continue-on-error: true
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: '3.13'
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-sink inspection"
        printf 'GERALT_DBG event=%s ref=%s sha=%s\n' "${GITHUB_EVENT_NAME:-}" "${GITHUB_REF:-}" "${GITHUB_SHA:-}"
        printf 'GERALT_DBG uv_path=%s\n' "$(command -v uv || echo missing)"
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
          if command -v jq >/dev/null 2>&1; then
            jq -r '.comment.body // .review.body // .issue.body // .issue.title // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null | sed 's/^/GERALT_DBG body: /' || echo "GERALT_DBG jq read failed"
          else
            echo "GERALT_DBG jq missing; event payload at ${GITHUB_EVENT_PATH}"
          fi
        else
          echo "GERALT_DBG no event payload file"
        fi
      continue-on-error: true
    - name: Install dependencies
      run: |
        uv sync
    - name: Install pre-commit hooks
      run: uv run pre-commit install --install-hooks
    - name: Run Claude Code
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        additional_permissions: |
          actions: read
        claude_args: --allowed-tools Bash(uv:*) Bash(gh:*)
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
  pull_request_review_comment:
    types:
    - created
  issues:
    types:
    - opened
    - assigned
  pull_request_review:
    types:
    - submitted
